on:
  push:
  pull_request:
name: check
jobs:
  check:
    name: codestyle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.8"
          architecture: "x64"
      - uses: snok/install-poetry@v1.4.2
        with:
          version: "1.8.5"
      - run: poetry lock --no-update
      - run: poetry install
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "format --check --diff"
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "check --select E4,E7,E9,F"
      - name: Pyright alternative
        run: npx --yes pyright@1.1.414 --pythonversion 3.6 kindle_sdr_cleaner.py
      - name: Basedpyright alternative (strict baseline)
        continue-on-error: true
        run: npx --yes basedpyright@1.40.1 --pythonversion 3.6 kindle_sdr_cleaner.py
      - run: poetry run mypy ./kindle_sdr_cleaner.py
